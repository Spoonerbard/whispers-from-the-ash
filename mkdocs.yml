site_name: whispers-from-the-ash  
theme: 
  name: material
  # palette toggle for automatic mode switch
  - scheme: default
    toggle:
      icon: material/brightness-4
      name: switch to dark mode
      # palette toggle for dark mode
  - scheme: slate
    toggle:
      icon: material/brightness-7
      name: switch to light mode
nav:
  - Home: home.md
  - About: about.md
  - index: index.md
plugins:
  - search
  - autolinks
  - ezlinks:
      warn_ambiguities: {true|false}
      wikilinks: {true|false}
      reference_links: {true|false}
  - callouts
  - obsidian-support:
      # use_shields: true   # Display backlinks and other metadata
      # home_page: index    # Specify your home page (optional)